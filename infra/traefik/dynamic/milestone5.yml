http:
  routers:
    milestone5-host:
      entryPoints:
        - web
      rule: PathPrefix(`/stream/m5-host`)
      service: milestone5-host
      middlewares:
        - milestone5-response-headers

    milestone5-client:
      entryPoints:
        - web
      rule: PathPrefix(`/stream/m5-client`)
      service: milestone5-client
      middlewares:
        - milestone5-response-headers

  middlewares:
    milestone5-response-headers:
      headers:
        contentTypeNosniff: true
        customResponseHeaders:
          Referrer-Policy: no-referrer
          X-Robots-Tag: noindex, nofollow

  services:
    milestone5-host:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: /stream/m5-host/api/health
          interval: 5s
          timeout: 2s
        servers:
          - url: http://retro-host:8080

    milestone5-client:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: /stream/m5-client/api/health
          interval: 5s
          timeout: 2s
        servers:
          - url: http://retro-client:8080
