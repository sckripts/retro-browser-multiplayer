entryPoints:
  web:
    address: ":8080"

providers:
  file:
    filename: /etc/traefik/dynamic/milestone1.yml
    watch: true

api:
  dashboard: false

ping:
  entryPoint: web

log:
  level: INFO

# Access logging is deliberately absent: the one-time bootstrap query contains
# a session token. Public TLS and identity integration arrive in later milestones.
