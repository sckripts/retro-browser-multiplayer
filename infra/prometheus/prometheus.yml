global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: session-manager
    static_configs:
      - targets: [session-manager:8080]

  - job_name: coturn
    static_configs:
      - targets: [coturn:9641]

  - job_name: selkies
    file_sd_configs:
      - files: [/etc/prometheus/runtime-targets/*.json]
        refresh_interval: 5s
